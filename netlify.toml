[build]
  command = "npm run build"
  publish = ".next"

# For Next.js API routes, Netlify automatically uses the Next.js runtime
# No explicit plugin configuration needed for Next.js 15+

# Environment variables should be set in Netlify Dashboard:
# Required: GEMINI_API_KEY (server-side only, not exposed to client)
# Go to: Netlify Dashboard -> Site Settings -> Environment Variables 